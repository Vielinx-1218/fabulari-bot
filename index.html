<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fabulari</title>

  <!-- Global Browser Tab Favicon -->
  <link rel="icon" type="image/png" href="fabulari-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #090910;
      --card: rgba(21, 21, 34, 0.65);
      --border: rgba(255, 255, 255, 0.1);
      --text: #eeedf7;
      --muted: #9492aa;
      --gradient: linear-gradient(115deg, #7955ef, #c465df);
    }

    /* Theme Variants */
    body.theme-cyan {
      --gradient: linear-gradient(115deg, #2788f1, #31e4e8);
    }
    body.theme-cyan .dot:nth-child(3) {
      background: linear-gradient(135deg, #2788f1, #31e4e8);
    }

    body.theme-orange {
      --gradient: linear-gradient(115deg, #ffc15c, #ff547c);
    }
    body.theme-orange .dot:nth-child(3) {
      background: linear-gradient(135deg, #ffc15c, #ff547c);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
      transition: background 0.3s ease;
    }

    button, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .mesh {
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
    }

    .mesh span {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .mesh span:nth-child(1) {
      background: radial-gradient(
        ellipse at 35% 30%, #7036c83b, transparent 48%
      );
      animation: drift-purple 18s ease-in-out infinite alternate;
    }

    .mesh span:nth-child(2) {
      background: radial-gradient(
        ellipse at 90% 70%, #1aa4bd20, transparent 42%
      );
      animation: drift-cyan 22s ease-in-out infinite alternate;
    }

    .mesh span:nth-child(3) {
      background: radial-gradient(
        ellipse at 40% 95%, #b7377c22, transparent 40%
      );
      animation: drift-rose 20s ease-in-out infinite alternate;
    }

    /* Edge-to-edge header */
    .header {
      height: 76px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 18, 30, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex: 0 0 auto;
    }

    .brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      isolation: isolate;
    }

    .brand::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 50%;
      width: 160px;
      height: 48px;
      transform: translateY(-50%);
      border-radius: 50%;
      background: linear-gradient(110deg, #8853ed4d, #d07dff33, #5b9bff1a);
      filter: blur(22px);
      z-index: -1;
      pointer-events: none;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      position: relative;
      overflow: hidden;
      border: 1px solid #b58aff66;
      border-radius: 12px;
      background: #0b0a19;
      box-shadow:
        0 0 16px #a78bfa55,
        0 4px 12px #0003;
    }

    .brand-icon img {
      position: absolute;
      width: 217.4%;
      height: 217.4%;
      max-width: none;
      left: -58.7%;
      top: -58.7%;
      object-fit: contain;
    }

    .brand-name {
      margin: 0;
      padding: 0 5px;
      font-family: "Great Vibes", cursive;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
      background: linear-gradient(
        90deg, #e0c3ff, #b47fff 40%, #9b5fef 70%, #d4a0ff
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter:
        drop-shadow(0 4px 9px #9b5fef80)
        drop-shadow(0 0 16px #c084fc55);
    }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .themes {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .theme:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .theme.selected {
      border-color: #bba6ff40;
      background: #9076da14;
      color: var(--text);
    }

    .swatch {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      font-size: 11px;
    }

    .purple { background: linear-gradient(135deg, #7554f4, #c568df); }
    .cyan { background: linear-gradient(135deg, #31e4e8, #2788f1); }
    .orange { background: linear-gradient(135deg, #ffc15c, #ff547c); }

    /* Main chat section taking full height and anchoring composer to bottom */
    .chat {
      width: min(960px, 100%);
      height: calc(100vh - 76px);
      height: calc(100svh - 76px);
      margin: 0 auto;
      padding: 16px 24px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      flex: 0 0 auto;
    }

    .modes {
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid #ffffff0f;
      border-radius: 10px;
      background: #0b0b144d;
    }

    .mode {
      padding: 7px 13px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .mode.active {
      background: #a291da24;
      color: var(--text);
    }

    .clear {
      padding: 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      transition: color 0.2s ease;
    }

    .clear:hover {
      color: var(--text);
    }

    /* Scrollable messages taking available space */
    .messages {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 4px 4px 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #393448 transparent;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 77%;
      line-height: 1.65;
      animation: fadeIn 0.3s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message p { margin: 0; }

    .assistant {
      align-self: flex-start;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 0 17px 17px 17px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .welcome {
      width: 77%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      border-radius: 12px;
      color: #b6b2ca;
      font-size: 13px;
    }

    .user {
      align-self: flex-end;
      max-width: 68%;
      padding: 16px 20px;
      border-radius: 18px 18px 0 18px;
      color: white;
      background: var(--gradient);
      box-shadow: 0 4px 15px rgba(121, 85, 239, 0.25);
    }

    .assistant-intro {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: #c4bfd6;
      font-size: 13px;
    }

    .spark {
      color: #bb9cff;
      font-size: 19px;
      line-height: 1;
    }

    .options { display: grid; gap: 14px; }

    .option {
      display: grid;
      grid-template-columns: 25px minmax(0, 1fr) 20px;
      gap: 10px;
      align-items: start;
    }

    .option-label {
      padding-top: 2px;
      color: #c2a9ff;
      font-size: 12px;
      font-weight: 600;
    }

    .copy {
      padding: 0;
      border: 0;
      background: transparent;
      color: #868199;
      font-size: 17px;
      transition: color 0.2s ease;
    }

    .copy:hover {
      color: var(--text);
    }

    .typing {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 12px;
      padding: 11px 15px;
      border-radius: 0 14px 14px 14px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
    }

    .typing.active {
      display: flex;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 16px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #df75ff);
      box-shadow: 0 0 9px #aa58ffb3;
      animation: jump 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.14s; }

    .dot:nth-child(3) {
      background: linear-gradient(135deg, #9368ff, #35dcef);
      box-shadow: 0 0 9px #53b9ff99;
      animation-delay: 0.28s;
    }

    /* Composer pinned securely at bottom */
    .composer {
      flex: 0 0 auto;
      padding-top: 8px;
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 10px 10px 20px;
      border: 1px solid #9d71f27a;
      border-radius: 16px;
      background: #151422d6;
      box-shadow: 0 0 22px #854de51a;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .input-shell:focus-within {
      border-color: #b38af8;
      box-shadow: 0 0 0 3px #9762f317, 0 0 30px #9762f333;
    }

    textarea {
      width: 100%;
      min-width: 0;
      height: 28px;
      padding: 4px 0;
      resize: none;
      outline: none;
      border: 0;
      color: var(--text);
      background: transparent;
      line-height: 20px;
    }

    textarea::placeholder { color: #8b859f; }

    .send {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #ffffff26;
      border-radius: 12px;
      background: var(--gradient);
      box-shadow: 0 4px 14px #774ce13d;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px #774ce166;
    }

    .send:active { transform: translateY(0); }

    .send svg { width: 20px; height: 20px; }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 8px;
      color: #80798f;
      font-size: 11px;
    }

    @keyframes drift-purple {
      to { transform: translate(32px, -18px) scale(1.04); }
    }

    @keyframes drift-cyan {
      to { transform: translate(-26px, 24px) scale(1.06); }
    }

    @keyframes drift-rose {
      to { transform: translate(20px, 16px) scale(1.03); }
    }

    @keyframes jump {
      0%, 40%, 100% { transform: translateY(0); }
      20% { transform: translateY(-5px); }
    }

    @media (max-width: 1100px) {
      .tagline { display: none; }
    }

    @media (max-width: 720px) {
      .header { padding: 0 16px; gap: 12px; }
      .brand-name { font-size: 34px; }
      .themes { gap: 3px; }
      .theme { padding: 5px; }
      .theme-name { display: none; }
      .chat { width: 100%; padding: 12px 16px; }
      .keyboard-hint { display: none; }
    }
  </style>
</head>

<body>

  <div class="mesh" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">
        <img src="fabulari-icon.png" alt="Fabulari Icon" onerror="this.style.display='none'">
      </div>
      <h1 class="brand-name">Fabulari</h1>
      <span class="tagline">Your words, with possibility.</span>
    </div>

    <div class="themes" role="group" aria-label="Theme selectors">
      <button class="theme selected" type="button" onclick="setTheme('purple', this)" aria-label="Cosmic Purple">
        <span class="swatch purple" aria-hidden="true">✓</span>
        <span class="theme-name">Cosmic Purple</span>
      </button>
      <button class="theme" type="button" onclick="setTheme('cyan', this)" aria-label="Cyberpunk Cyan">
        <span class="swatch cyan" aria-hidden="true"></span>
        <span class="theme-name">Cyberpunk Cyan</span>
      </button>
      <button class="theme" type="button" onclick="setTheme('orange', this)" aria-label="Sunset Orange">
        <span class="swatch orange" aria-hidden="true"></span>
        <span class="theme-name">Sunset Orange</span>
      </button>
    </div>
  </header>

  <!-- Main Chat Section -->
  <section class="chat" aria-label="Conversation">
    <div class="toolbar">
      <div class="modes" role="group" aria-label="Reply mode selectors">
        <button class="mode active" type="button" onclick="setMode(this)">Public Comments</button>
        <button class="mode" type="button" onclick="setMode(this)">Private DM</button>
        <button class="mode" type="button" onclick="setMode(this)">Business / Collab</button>
      </div>
      <button class="clear" type="button" onclick="clearChat()">↺ &nbsp; Clear</button>
    </div>

    <!-- Clean, empty starting state with just the welcome message -->
    <div class="messages" id="messagesContainer" tabindex="0" aria-label="Message log">
      <article class="message assistant welcome" aria-label="Fabulari">
        <span class="spark" aria-hidden="true">✣</span>
        <p>Type your message or custom instructions below to generate options.</p>
      </article>
    </div>

    <!-- Typing Indicator Element -->
    <div class="message assistant typing" id="typingIndicator" role="status">
      <div class="dots" aria-hidden="true">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <span id="typingText">Refining your reply</span>
    </div>

    <footer class="composer">
      <div class="input-shell">
        <textarea
          id="userInput"
          rows="1"
          aria-label="Message input"
          placeholder="Send a message or type instructions..."
        ></textarea>

        <button class="send" id="sendBtn" type="button" onclick="handleSend()" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"></path>
          </svg>
        </button>
      </div>

      <div class="composer-footer">
        <span>A little inspiration. Always your voice.</span>
        <span class="keyboard-hint">
          Enter to send · Shift + Enter for a new line
        </span>
      </div>
    </footer>
  </section>

  <script>
    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');

    function setTheme(themeName, btn) {
      document.body.className = '';
      if (themeName !== 'purple') {
        document.body.classList.add(`theme-${themeName}`);
      }

      document.querySelectorAll('.theme').forEach(t => {
        t.classList.remove('selected');
        const swatch = t.querySelector('.swatch');
        swatch.textContent = '';
      });

      btn.classList.add('selected');
      btn.querySelector('.swatch').textContent = '✓';
    }

    function setMode(btn) {
      document.querySelectorAll('.mode').forEach(m => m.classList.remove('active'));
      btn.classList.add('active');
    }

    function clearChat() {
      messagesContainer.innerHTML = `
        <article class="message assistant welcome" aria-label="Fabulari">
          <span class="spark" aria-hidden="true">✣</span>
          <p>Chat cleared. Type your message or custom instructions below.</p>
        </article>
      `;
    }

    function copyText(btn) {
      const text = btn.previousElementSibling.textContent;
      navigator.clipboard.writeText(text).then(() => {
        const original = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => { btn.textContent = original; }, 1200);
      });
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendMessage(htmlContent, senderClass) {
      const article = document.createElement('article');
      article.className = `message ${senderClass}`;
      article.innerHTML = htmlContent;
      messagesContainer.appendChild(article);
      scrollToBottom();
    }

    // Dynamic response generator responding contextually to user input
    function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      // Add user message
      appendMessage(`<p>${escapeHtml(text)}</p>`, 'user');
      userInput.value = '';
      userInput.style.height = '28px';

      // Show typing indicator
      messagesContainer.appendChild(typingIndicator);
      typingIndicator.classList.add('active');
      scrollToBottom();

      // Generate context-aware assistant options based on what the user typed
      setTimeout(() => {
        typingIndicator.classList.remove('active');
        
        let responseText = `Here is a polished option for "${escapeHtml(text.length > 30 ? text.substring(0, 30) + '...' : text)}":`;
        
        const botReply = `
          <div class="assistant-intro">
            <span class="spark" aria-hidden="true">✣</span>
            <p>${responseText}</p>
          </div>
          <div class="options">
            <div class="option">
              <span class="option-label">(1)</span>
              <p>That's a wonderful perspective! I love how you approached this.</p>
              <button class="copy" type="button" onclick="copyText(this)">⧉</button>
            </div>
            <div class="option">
              <span class="option-label">(2)</span>
              <p>Totally agree with you here. Let's build on this idea further!</p>
              <button class="copy" type="button" onclick="copyText(this)">⧉</button>
            </div>
          </div>
        `;
        appendMessage(botReply, 'assistant');
      }, 1200);
    }

    function escapeHtml(string) {
      return string.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    userInput.addEventListener('input', function() {
      this.style.height = '28px';
      this.style.height = (this.scrollHeight - 6) + 'px';
    });

    userInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
