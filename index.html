
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fabulari</title>

  <link rel="icon" type="image/png" sizes="32x32" href="fabulari-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090910;
      --card: rgba(21, 21, 34, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --text: #eeedf7;
      --muted: #9492aa;
      --gradient: linear-gradient(115deg, #7955ef, #c465df);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
    }

    button, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .mesh {
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
    }

    .mesh span {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .mesh span:nth-child(1) {
      background: radial-gradient(ellipse at 35% 30%, #7036c83b, transparent 48%);
      animation: drift-purple 18s ease-in-out infinite alternate;
    }

    .mesh span:nth-child(2) {
      background: radial-gradient(ellipse at 90% 70%, #1aa4bd20, transparent 42%);
      animation: drift-cyan 22s ease-in-out infinite alternate;
    }

    .mesh span:nth-child(3) {
      background: radial-gradient(ellipse at 40% 95%, #b7377c22, transparent 40%);
      animation: drift-rose 20s ease-in-out infinite alternate;
    }

    .header {
      min-height: 76px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 18, 30, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex: 0 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(121, 85, 239, 0.4));
    }

    .brand-name {
      margin: 0;
      padding: 0 5px;
      font-family: "Great Vibes", cursive;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
      background: linear-gradient(90deg, #e0c3ff, #b47fff 40%, #9b5fef 70%, #d4a0ff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 9px #9b5fef80);
    }

    .chat {
      width: min(960px, 100%);
      height: calc(100vh - 76px);
      height: calc(100svh - 76px);
      min-height: 0;
      margin: 0 auto;
      padding: 16px 24px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      flex: 0 0 auto;
    }

    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      padding: 4px;
      border: 1px solid #ffffff0f;
      border-radius: 10px;
      background: #0b0b144d;
    }

    .mode {
      padding: 7px 13px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .mode.active {
      background: #a291da24;
      color: var(--text);
    }

    .clear {
      padding: 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      flex: 0 0 auto;
    }

    .clear:hover { color: var(--text); }

    .messages {
      width: 100%;
      min-height: 0;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 16px;
      padding: 4px 4px 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #393448 transparent;
      scroll-behavior: smooth;
    }

    .welcome-hero {
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      animation: fadeIn 0.4s ease forwards;
    }

    .hero-logo-large {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-large::before {
      content: "";
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7955ef, #c465df, #31e4e8, #7955ef);
      filter: blur(32px);
      opacity: 0.7;
      z-index: -1;
      animation: rotateGlow 6s linear infinite;
    }

    .hero-logo-large img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(121, 85, 239, 0.5));
    }

    .welcome-hero h2 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      background: linear-gradient(90deg, #eeedf7, #b47fff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      width: fit-content;
      max-width: 78%;
      min-width: 0;
      animation: fadeIn 0.3s ease forwards;
    }

    .message-row.user {
      align-self: flex-end;
      justify-content: flex-end;
    }

    .message-row.assistant { align-self: flex-start; }

    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0b0a19;
      border: 1px solid #b58aff66;
      flex: 0 0 auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(121, 85, 239, 0.3);
      margin-bottom: 2px;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .message {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.6;
      padding: 12px 18px;
      font-size: 0.95rem;
    }

    .message p {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.assistant .message {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
    }

    .message-row.user .message {
      background: var(--gradient);
      border-radius: 18px 18px 4px 18px;
      color: white;
      box-shadow: 0 4px 15px rgba(121, 85, 239, 0.25);
    }

    /* Animated three-dot typing indicator */
    .typing-row {
      display: none;
      align-self: flex-start;
      align-items: flex-end;
      gap: 10px;
      flex: 0 0 auto;
      padding: 4px;
      animation: fadeIn 0.3s ease forwards;
    }

    .typing-row.active { display: flex; }

    .typing {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 18px 18px 18px 4px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 14px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #df75ff);
      box-shadow: 0 0 9px #aa58ffb3;
      animation: jump 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.14s; }

    .dot:nth-child(3) {
      background: linear-gradient(135deg, #9368ff, #35dcef);
      box-shadow: 0 0 9px #53b9ff99;
      animation-delay: 0.28s;
    }

    .composer {
      flex: 0 0 auto;
      width: 100%;
      padding-top: 8px;
      margin-top: auto;
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-width: 0;
      padding: 10px 10px 10px 20px;
      border: 1px solid #9d71f27a;
      border-radius: 16px;
      background: #151422e8;
      box-shadow: 0 0 22px #854de51a;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .input-shell:focus-within {
      border-color: #b38af8;
      box-shadow: 0 0 0 3px #9762f317, 0 0 30px #9762f333;
    }

    .input-shell textarea#userInput {
      display: block;
      flex: 1 1 auto;
      width: 0;
      min-width: 0;
      max-width: 100%;
      height: 28px;
      min-height: 28px;
      max-height: 160px;
      margin: 0;
      padding: 4px 0;
      resize: none;
      overflow-y: auto;
      outline: none;
      border: 0;
      color: var(--text);
      background: transparent;
      line-height: 20px;
      box-shadow: none;
    }

    textarea::placeholder { color: #8b859f; }

    .send {
      width: 42px;
      min-width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border: 1px solid #ffffff26;
      border-radius: 12px;
      background: var(--gradient);
      box-shadow: 0 4px 14px #774ce13d;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px #774ce166;
    }

    .send:active { transform: translateY(0); }
    .send:disabled { opacity: 0.6; cursor: wait; }
    .send svg { width: 20px; height: 20px; }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 8px;
      color: #80798f;
      font-size: 11px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes drift-purple {
      to { transform: translate(32px, -18px) scale(1.04); }
    }

    @keyframes drift-cyan {
      to { transform: translate(-26px, 24px) scale(1.06); }
    }

    @keyframes drift-rose {
      to { transform: translate(20px, 16px) scale(1.03); }
    }

    @keyframes jump {
      0%, 40%, 100% { transform: translateY(0); opacity: 0.5; }
      20% { transform: translateY(-5px); opacity: 1; }
    }

    @media (max-width: 720px) {
      .header { padding: 0 16px; }
      .brand-icon { width: 38px; height: 38px; }
      .hero-logo-large { width: 140px; height: 140px; }
      .brand-name { font-size: 34px; }
      .chat { width: 100%; padding: 12px 16px; }
      .toolbar { align-items: flex-start; }
      .modes { flex-wrap: wrap; }
      .mode { padding: 6px 8px; }
      .message-row { max-width: 92%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="mesh" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <header class="header">
    <div class="brand">
      <div class="brand-icon">
        <img src="fabulari-icon.png" alt="Fabulari Icon" onerror="this.style.display='none'">
      </div>
      <h1 class="brand-name">Fabulari</h1>
    </div>
  </header>

  <section class="chat" aria-label="Conversation">
    <div class="toolbar">
     
      <button class="clear" type="button" onclick="clearChat()">↺ &nbsp; Clear</button>
    </div>

    <div class="messages" id="messagesContainer" tabindex="0" aria-label="Message log">
      <div class="welcome-hero" id="welcomeHero">
        <div class="hero-logo-large">
          <img src="fabulari-icon.png" alt="Fabulari Logo" onerror="this.style.display='none'">
        </div>
        <h2>Where words find their voice.</h2>
      </div>
    </div>

    <div class="typing-row" id="typingIndicator" role="status" aria-live="polite">
      <div class="chat-avatar">
        <img src="fabulari-icon.png" alt="" onerror="this.style.display='none'">
      </div>
      <div class="message typing">
        <div class="dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <span>Fabulari is thinking</span>
      </div>
    </div>

    <footer class="composer">
      <div class="input-shell">
        <textarea
          id="userInput"
          rows="1"
          aria-label="Message input"
          placeholder="Say something..."
        ></textarea>

        <button class="send" id="sendBtn" type="button" onclick="handleSend()" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"></path>
          </svg>
        </button>
      </div>

      <div class="composer-footer">
        <span>A little inspiration. Always your voice.</span>
        <span class="keyboard-hint"></span>
      </div>
    </footer>
  </section>

  <script>
    const messagesContainer = document.getElementById('messagesContainer');
    const userInput = document.getElementById('userInput');
    const typingIndicator = document.getElementById('typingIndicator');
    const sendBtn = document.getElementById('sendBtn');

    let conversationHistory = [];
    let currentMode = 'default';
    let isSending = false;

    function setMode(btn) {
      document.querySelectorAll('.mode').forEach(mode => {
        mode.classList.remove('active');
      });

      btn.classList.add('active');

      const label = btn.textContent.trim().toLowerCase();

      if (label.includes('private')) {
        currentMode = 'private_dm';
      } else if (label.includes('business')) {
        currentMode = 'business_collab';
      } else {
        currentMode = 'default';
      }
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function clearChat() {
      if (isSending) return;

      conversationHistory = [];

      messagesContainer.innerHTML = `
        <div class="welcome-hero" id="welcomeHero">
          <div class="hero-logo-large">
            <img src="fabulari-icon.png"
                 alt="Fabulari Logo"
                 onerror="this.style.display='none'">
          </div>
          <h2>Where words find their voice.</h2>
        </div>
      `;

      typingIndicator.classList.remove('active');
      userInput.focus();
    }

    function appendMessage(content, senderClass) {
      const hero = document.getElementById('welcomeHero');
      if (hero) hero.remove();

      const row = document.createElement('div');
      row.className = `message-row ${senderClass}`;

      if (senderClass === 'assistant') {
        const avatar = document.createElement('div');
        avatar.className = 'chat-avatar';

        const img = document.createElement('img');
        img.src = 'fabulari-icon.png';
        img.alt = 'Fabulari';
        img.onerror = function() { this.style.display = 'none'; };

        avatar.appendChild(img);
        row.appendChild(avatar);
      }

      const article = document.createElement('article');
      article.className = 'message';

      const paragraph = document.createElement('p');
      paragraph.textContent = content;

      article.appendChild(paragraph);
      row.appendChild(article);
      messagesContainer.appendChild(row);

      scrollToBottom();
    }

    async function handleSend() {
      const text = userInput.value.trim();

      if (!text || isSending) return;

      isSending = true;
      sendBtn.disabled = true;
      typingIndicator.classList.add('active');

      appendMessage(text, 'user');

      conversationHistory.push({
        role: 'user',
        content: text
      });

      userInput.value = '';
      userInput.style.height = '28px';
      scrollToBottom();

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: conversationHistory,
            mode: currentMode
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error('The server returned an invalid response.');
        }

        if (!response.ok) {
          throw new Error(
            data.reply || data.error || `Request failed (${response.status})`
          );
        }

        const reply = data.reply || data.text || data.result;

        if (typeof reply !== 'string' || !reply.trim()) {
          throw new Error('The server returned an empty response.');
        }

        conversationHistory.push({
          role: 'assistant',
          content: reply
        });

        appendMessage(reply, 'assistant');

      } catch (error) {
        console.error('Chat request failed:', error);

        appendMessage(
          `Unable to get a response: ${error.message}. Please try again.`,
          'assistant'
        );

        // Remove the failed user message from history.
        const lastMessage = conversationHistory[conversationHistory.length - 1];
        if (lastMessage && lastMessage.role === 'user' && lastMessage.content === text) {
          conversationHistory.pop();
        }

      } finally {
        typingIndicator.classList.remove('active');
        isSending = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    userInput.addEventListener('input', function() {
      this.style.height = '28px';
      this.style.height = Math.min(this.scrollHeight, 160) + 'px';
    });

    userInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        handleSend();
      }
    });
  </script>
</body>
</html>
