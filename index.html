<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Fabulari</title>

  <!-- Fallback / Direct Data URI Favicon to guarantee browser tab icon loads -->
 <link rel="icon" type="image/png" sizes="32x32" href="fabulari-icon.png">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #090910;
      --card: rgba(21, 21, 34, 0.75);
      --border: rgba(255, 255, 255, 0.1);
      --text: #eeedf7;
      --muted: #9492aa;
      --gradient: linear-gradient(115deg, #7955ef, #c465df);
    }

    /* Theme Variants */
    body.theme-cyan {
      --gradient: linear-gradient(115deg, #2788f1, #31e4e8);
    }
    body.theme-cyan .dot:nth-child(3) {
      background: linear-gradient(135deg, #2788f1, #31e4e8);
    }

    body.theme-orange {
      --gradient: linear-gradient(115deg, #ffc15c, #ff547c);
    }
    body.theme-orange .dot:nth-child(3) {
      background: linear-gradient(135deg, #ffc15c, #ff547c);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.6 system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      isolation: isolate;
      transition: background 0.3s ease;
    }

    button, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .mesh {
      position: fixed;
      inset: -15%;
      z-index: -1;
      pointer-events: none;
    }

    .mesh span {
      position: absolute;
      inset: 0;
      will-change: transform;
    }

    .mesh span:nth-child(1) {
      background: radial-gradient(
        ellipse at 35% 30%, #7036c83b, transparent 48%
      );
      animation: drift-purple 18s ease-in-out infinite alternate;
    }

    .mesh span:nth-child(2) {
      background: radial-gradient(
        ellipse at 90% 70%, #1aa4bd20, transparent 42%
      );
      animation: drift-cyan 22s ease-in-out infinite alternate;
    }

    .mesh span:nth-child(3) {
      background: radial-gradient(
        ellipse at 40% 95%, #b7377c22, transparent 40%
      );
      animation: drift-rose 20s ease-in-out infinite alternate;
    }

    /* Edge-to-edge header */
    .header {
      height: 76px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 18, 30, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      flex: 0 0 auto;
    }

    .brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      isolation: isolate;
    }

    /* Top-Left Header Logo */
    .brand-icon {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .brand-icon::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7955ef, #c465df, #31e4e8, #7955ef);
      filter: blur(12px);
      opacity: 0;
      z-index: -1;
      transition: opacity 0.3s ease;
    }

    .brand-icon:hover {
      transform: scale(1.08);
    }

    .brand-icon:hover::before {
      opacity: 0.85;
      animation: rotateGlow 3s linear infinite;
    }

    .brand-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(121, 85, 239, 0.4));
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .brand-name {
      margin: 0;
      padding: 0 5px;
      font-family: "Great Vibes", cursive;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.2;
      white-space: nowrap;
      cursor: pointer;
      background: linear-gradient(
        90deg, #e0c3ff, #b47fff 40%, #9b5fef 70%, #d4a0ff
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter:
        drop-shadow(0 4px 9px #9b5fef80)
        drop-shadow(0 0 16px #c084fc55);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), filter 0.35s ease;
    }

    .brand-name:hover {
      transform: translateY(-2px);
      filter:
        drop-shadow(0 6px 14px #b47fffb3)
        drop-shadow(0 0 22px #c084fc88);
    }

    .tagline {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .themes {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .theme:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .theme.selected {
      border-color: #bba6ff40;
      background: #9076da14;
      color: var(--text);
    }

    .swatch {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      font-size: 11px;
    }

    .purple { background: linear-gradient(135deg, #7554f4, #c568df); }
    .cyan { background: linear-gradient(135deg, #31e4e8, #2788f1); }
    .orange { background: linear-gradient(135deg, #ffc15c, #ff547c); }

    /* Main chat section */
    .chat {
      width: min(960px, 100%);
      height: calc(100vh - 76px);
      height: calc(100svh - 76px);
      margin: 0 auto;
      padding: 16px 24px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      flex: 0 0 auto;
    }

    .modes {
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid #ffffff0f;
      border-radius: 10px;
      background: #0b0b144d;
    }

    .mode {
      padding: 7px 13px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .mode.active {
      background: #a291da24;
      color: var(--text);
    }

    .clear {
      padding: 8px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      transition: color 0.2s ease;
    }

    .clear:hover {
      color: var(--text);
    }

    /* Scrollable messages container */
    .messages {
      min-height: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 4px 4px 16px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #393448 transparent;
      scroll-behavior: smooth;
    }

    /* Centered Welcome Hero Screen */
    .welcome-hero {
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px;
      animation: fadeIn 0.4s ease forwards;
    }

    .hero-logo-large {
      width: 220px;
      height: 220px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .hero-logo-large::before {
      content: "";
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #7955ef, #c465df, #31e4e8, #7955ef);
      filter: blur(32px);
      opacity: 0.7;
      z-index: -1;
      transition: opacity 0.3s ease;
      animation: rotateGlow 6s linear infinite;
    }

    .hero-logo-large:hover {
      transform: scale(1.05);
    }

    .hero-logo-large:hover::before {
      opacity: 1;
    }

    .hero-logo-large img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 24px rgba(121, 85, 239, 0.5));
    }

    .welcome-hero h2 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      background: linear-gradient(90deg, #eeedf7, #b47fff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    /* Messenger Row Layout (Avatar + Bubble) */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 78%;
      animation: fadeIn 0.3s ease forwards;
    }

    .message-row.user {
      align-self: flex-end;
      justify-content: flex-end;
    }

    .message-row.assistant {
      align-self: flex-start;
    }

    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #0b0a19;
      border: 1px solid #b58aff66;
      flex: 0 0 auto;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(121, 85, 239, 0.3);
      margin-bottom: 2px;
    }

    .chat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Chat Bubbles */
    .message {
      line-height: 1.6;
      padding: 12px 18px;
      font-size: 0.95rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message p { margin: 0; word-break: break-word; }

    /* Assistant Bubble */
    .message-row.assistant .message {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px 18px 18px 4px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: var(--text);
    }

    /* User Bubble */
    .message-row.user .message {
      background: var(--gradient);
      border-radius: 18px 18px 4px 18px;
      color: white;
      box-shadow: 0 4px 15px rgba(121, 85, 239, 0.25);
    }

    /* Typing Indicator Row */
    .typing-row {
      display: none;
      align-self: flex-start;
      align-items: flex-end;
      gap: 10px;
      animation: fadeIn 0.3s ease forwards;
    }

    .typing-row.active {
      display: flex;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: 18px 18px 18px 4px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 14px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #df75ff);
      box-shadow: 0 0 9px #aa58ffb3;
      animation: jump 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.14s; }

    .dot:nth-child(3) {
      background: linear-gradient(135deg, #9368ff, #35dcef);
      box-shadow: 0 0 9px #53b9ff99;
      animation-delay: 0.28s;
    }

    /* Composer */
    .composer {
      flex: 0 0 auto;
      padding-top: 8px;
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 10px 10px 20px;
      border: 1px solid #9d71f27a;
      border-radius: 16px;
      background: #151422d6;
      box-shadow: 0 0 22px #854de51a;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .input-shell:focus-within {
      border-color: #b38af8;
      box-shadow: 0 0 0 3px #9762f317, 0 0 30px #9762f333;
    }

    textarea {
      width: 100%;
      min-width: 0;
      height: 28px;
      padding: 4px 0;
      resize: none;
      outline: none;
      border: 0;
      color: var(--text);
      background: transparent;
      line-height: 20px;
    }

    textarea::placeholder { color: #8b859f; }

    .send {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 1px solid #ffffff26;
      border-radius: 12px;
      background: var(--gradient);
      box-shadow: 0 4px 14px #774ce13d;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .send:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px #774ce166;
    }

    .send:active { transform: translateY(0); }

    .send svg { width: 20px; height: 20px; }

    .composer-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 8px;
      color: #80798f;
      font-size: 11px;
    }

    @keyframes drift-purple {
      to { transform: translate(32px, -18px) scale(1.04); }
    }

    @keyframes drift-cyan {
      to { transform: translate(-26px, 24px) scale(1.06); }
    }

    @keyframes drift-rose {
      to { transform: translate(20px, 16px) scale(1.03); }
    }

    @keyframes jump {
      0%, 40%, 100% { transform: translateY(0); }
      20% { transform: translateY(-5px); }
    }

    @media (max-width: 1100px) {
      .tagline { display: none; }
    }

    @media (max-width: 720px) {
      .header { padding: 0 16px; gap: 12px; }
      .brand-icon { width: 38px; height: 38px; }
      .hero-logo-large { width: 140px; height: 140px; }
      .brand-name { font-size: 34px; }
      .themes { gap: 3px; }
      .theme { padding: 5px; }
      .theme-name { display: none; }
      .chat { width: 100%; padding: 12px 16px; }
      .keyboard-hint { display: none; }
    }
  </style>
</head>

<body>

  <div class="mesh" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">
        <img src="fabulari-icon.png" alt="Fabulari Icon" onerror="this.style.display='none'">
      </div>
      <h1 class="brand-name">Fabulari</h1>
     
    </div>

    
  </header>

  <!-- Main Chat Section -->
  <section class="chat" aria-label="Conversation">
    
      <button class="clear" type="button" onclick="clearChat()">↺ &nbsp; Clear</button>
    </div>

    <!-- Messages Container with Welcome Hero -->
    <div class="messages" id="messagesContainer" tabindex="0" aria-label="Message log">
      <div class="welcome-hero" id="welcomeHero">
        <div class="hero-logo-large">
          <img src="fabulari-icon.png" alt="Fabulari Logo" onerror="this.style.display='none'">
        </div>
        <h2>Where words find their voice.</h2>
      </div>
    </div>

    <!-- Messenger-style Typing Indicator Row with Bot Avatar -->
    <div class="typing-row" id="typingIndicator" role="status">
      <div class="chat-avatar">
        <img src="fabulari-icon.png" alt="Bot Avatar" onerror="this.style.display='none'">
      </div>
      <div class="message typing">
        <div class="dots" aria-hidden="true">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
        <span>Fabulari is thinking</span>
      </div>
    </div>

    <footer class="composer">
      <div class="input-shell">
        <textarea
          id="userInput"
          rows="1"
          aria-label="Message input"
          placeholder="Send a message or type instructions..."
        ></textarea>

        <button class="send" id="sendBtn" type="button" onclick="handleSend()" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5M5 12l7-7 7 7"></path>
          </svg>
        </button>
      </div>

      <div class="composer-footer">
        <span>A little inspiration. Always your voice.</span>
        <span class="keyboard-hint">
          Enter to send · Shift + Enter for a new line
        </span>
      </div>
    </footer>
  </section>


<script>
  const messagesContainer = document.getElementById('messagesContainer');
  const userInput = document.getElementById('userInput');

  let conversationHistory = [];
  let currentMode = 'default';
  let isSending = false;

  function setTheme(themeName, btn) {
    document.body.className = '';

    if (themeName !== 'purple') {
      document.body.classList.add(`theme-${themeName}`);
    }

    document.querySelectorAll('.theme').forEach(t => {
      t.classList.remove('selected');
      t.querySelector('.swatch').textContent = '';
    });

    btn.classList.add('selected');
    btn.querySelector('.swatch').textContent = '✓';
  }

  function setMode(btn) {
    document.querySelectorAll('.mode').forEach(m =>
      m.classList.remove('active')
    );

    btn.classList.add('active');

    const label = btn.textContent.trim().toLowerCase();

    if (label.includes('private')) {
      currentMode = 'private_dm';
    } else if (label.includes('business')) {
      currentMode = 'business_collab';
    } else {
      currentMode = 'default';
    }
  }

  function clearChat() {
    conversationHistory = [];

    messagesContainer.innerHTML = `
      <div class="welcome-hero" id="welcomeHero">
        <div class="hero-logo-large">
          <img src="fabulari-icon.png"
               alt="Fabulari Logo"
               onerror="this.style.display='none'">
        </div>
        <h2>Where words find their voice.</h2>
      </div>
    `;
  }

  function scrollToBottom() {
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function escapeHtml(string) {
    return String(string)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function appendMessage(content, senderClass) {
    const hero = document.getElementById('welcomeHero');
    if (hero) hero.remove();

    const row = document.createElement('div');
    row.className = `message-row ${senderClass}`;

    if (senderClass === 'assistant') {
      const avatar = document.createElement('div');
      avatar.className = 'chat-avatar';

      const img = document.createElement('img');
      img.src = 'fabulari-icon.png';
      img.alt = 'Fabulari';

      avatar.appendChild(img);
      row.appendChild(avatar);
    }

    const article = document.createElement('article');
    article.className = 'message';

    const paragraph = document.createElement('p');
    paragraph.textContent = content;

    article.appendChild(paragraph);
    row.appendChild(article);
    messagesContainer.appendChild(row);

    scrollToBottom();
  }

  async function handleSend() {
    const text = userInput.value.trim();

    if (!text || isSending) return;

    isSending = true;

    appendMessage(text, 'user');

    conversationHistory.push({
      role: 'user',
      content: text
    });

    userInput.value = '';
    userInput.style.height = '28px';

    const sendBtn = document.getElementById('sendBtn');
    if (sendBtn) sendBtn.disabled = true;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          messages: conversationHistory,
          mode: currentMode
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.reply || `Request failed (${response.status})`
        );
      }

      const reply = data.reply || data.text || data.result;

      if (typeof reply !== 'string' || !reply.trim()) {
        throw new Error('The server returned an empty response.');
      }

      conversationHistory.push({
        role: 'assistant',
        content: reply
      });

      appendMessage(reply, 'assistant');

    } catch (error) {
      console.error('Chat request failed:', error);

      appendMessage(
        `Unable to get a response: ${error.message}. Please try again.`,
        'assistant'
      );

      // Remove the failed user turn from history so it
      // can be submitted again without duplicating it.
      conversationHistory.pop();

    } finally {
      isSending = false;

      if (sendBtn) sendBtn.disabled = false;

      userInput.focus();
    }
  }

  userInput.addEventListener('input', function() {
    this.style.height = '28px';
    this.style.height = (this.scrollHeight - 6) + 'px';
  });

  userInput.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      handleSend();
    }
  });
</script>

</body>
</html>
